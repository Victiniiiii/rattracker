name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
          - name: windows-x64
            os: windows-2022
          - name: macos-arm64
            os: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux runtime and build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            patchelf build-essential pkg-config \
            libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libdbus-1-3 libfontconfig1 fonts-dejavu-core

      - name: Create virtual environment and install dependencies
        shell: bash
        run: |
          python -m venv venv
          if [ -x venv/bin/python ]; then PY=venv/bin/python; else PY=venv/Scripts/python.exe; fi
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install -r requirements.txt

      - name: Run tests
        shell: bash
        run: make test

      - name: Compile standalone app
        shell: bash
        run: make build

      - name: Run compiled app end to end
        shell: bash
        run: make smoke

      - name: Build Linux installers
        if: runner.os == 'Linux'
        shell: bash
        run: make deb appimage

      - name: Build macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: make dmg

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "C:\\Program Files (x86)\\Inno Setup 6" >> "$GITHUB_PATH"
          make installer

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: rattracker-${{ matrix.name }}
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/*.dmg
            dist/*setup.exe
          if-no-files-found: error
