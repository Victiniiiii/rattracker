<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>Rat Tracker</title>
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<h1>Rat Tracker</h1>

		<div id="version-language-div">
			<div id="language"></div> <!-- The flags are at /assets/fr.svg (same as tr.svg and uk.svg)-->
			<div id="version">Version: 1.0.0</div>
		</div>

		<button id="settings">Settings</button> <!-- /assets/settings.svg (the icon)-->

		<div id="mainDiv">
			<div id="beforeScript">
				<button id="selectFile">Select Video</button>
				<p id="filePath">No file selected</p>
				<input type="text" placeholder="Video Start" />
				<input type="text" placeholder="Video End" />
				<button id="runBtn" disabled>Run</button>
			</div>
			<div id="duringScript">
				<progress id="progressBar" value="0" max="100"></progress>
				<span id="progressText">0%</span>
				<button id="cancelBtn" disabled>Cancel</button>
			</div>
			<div id="afterScript">
				<!-- output video shown in html -->
				<!-- output csv shown in html -->
				<!-- output text shown in html -->
				<!-- a dropdown to switch between these three-->
			</div>
		</div>

		<script type="module" src="main.js"></script>
	</body>
</html>
